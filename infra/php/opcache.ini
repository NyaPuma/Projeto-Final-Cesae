; OPcache configuration for production (high traffic Laravel + Octane/FrankenPHP).
; Loaded via PHP_INI_SCAN_DIR in the production Dockerfile.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
; Prevent Octane workers from dying on opcache compile warnings in long-lived processes
opcache.log_verbosity_level=1